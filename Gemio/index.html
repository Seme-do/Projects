<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body> 
        <div class="left-sidebar">
            <div class="Gemio-title">
            <img src="thumbnails/download (1).svg"
                alt="Logo" class="logo">
            <h1>Gemio</h1>
        </div>
            <h4>General</h4>
            <div class="General-button">
            <img src="thumbnails/logotipo de icono de restaurante.jpg"
                alt="Overview" class="icon">
            <button class="Overview-text">
                Overview
            </button>
            </div>
            <div class="General-button">
            <img src="thumbnails/logo design.jpg"
                alt="Restaurants" class="icon">
            <button class="Restaurant-text">
                Restaurants
            </button>
            </div>
             <div class="General-button">
            <img src="thumbnails/Reserved Sign For Restaurants Bars Cafes _ Personalized Reserved Table Signs _ Sign for Business _ Reception Sign _ Hotel Sign.jpg"
                alt="Reservations" class="icon">
                 <button class="Reservation-text">
                    Reservations
                </button>
            </div>
            <div class="General-button">
            <img src="thumbnails/Account Avatar User  Flat Color Icon  Vector Icon Banner Templ, User Icons, Avatar Icons, Icons Icons PNG and Vector with Transparent Background for Free Download.jpg"
                alt="Customers" class="icon">
            <button class="Customer-text">
                Customers
            </button>
            </div>
             <div class="General-button">
            <img src="thumbnails/data analysis.jpg"
                alt="Reports" class="icon">
                <button class="Report-text">
                    Reports
                </button>
             </div>
            <div class="General-button">
            <img src="thumbnails/mobile payment.jpg"
                alt="Payments" class="icon">
            <button class="Payment-text">
                Payments
            </button>
            </div>
            <div class="General-button">
            <img src="thumbnails/settings image.jpg"
                alt="Settings" class="icon">
            <button class="Settings-text">
                Settings
            </button>
            </div>
              <div class="Add-restaurant-option">  
            <img src="thumbnails/imagens de logotipo de comida vegetariana.jpg"
                alt="Logout" class="Add-restaurant-icon">
            <p class="Grow-add-restaurant">
                 Grow Your Restaurant Network
                </p>
            <p class="Description-add-restaurant">
                Add more restaurants to Gemio and increase reservations.
            </p>
            <button class="Add-restaurant-button">
                Add Restaurant
            </button>
              </div>
              <div class="log-out-option">
            <img src="thumbnails/log out icon.jpg"
                alt="Log Out" class="icons">
                <p>Log Out</p>
              </div>
        </div>
    <div class="top-bar">
        <div class="admin-profile">
    <img src="thumbnails/RONALDO prime dönem foto (1).jpg"
     alt="profile Image" class="admin-photo">
     <div class="admin-text">
    <p>Welcome back, Admin</p>
    <p>
        Manage restaurants, reservations, and platform activity.
    </p>
          </div>
        </div>
    <input type="text" placeholder="Search restaurants, users, reservations..."
     class="search-bar">
    </div>
